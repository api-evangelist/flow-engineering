aid: flow-engineering
name: Flow Engineering
description: 'Flow Engineering builds a requirements-management and AI-agent platform for hardware
  engineering teams. Its Systems Graph connects requirements, CAD, simulation, code, and test into a
  single system of record, and its AI agents continuously run impact analysis, check test coverage,
  verify compliance, and track mass, cost, and power budgets as designs change. Flow integrates with
  CAD, PLM, simulation, and developer tools (Onshape, GitHub, GitLab, Jira, Linear, Confluence, and
  more) and is used by hardware teams at companies such as Rivian, Joby, Skydio, and Isar Aerospace.
  The platform is backed by a GraphQL API at api.flowengineering.com secured with AWS Cognito OAuth2/OIDC,
  with API access included on paid plans. Flow Engineering is a portfolio company of EQT Ventures.'
